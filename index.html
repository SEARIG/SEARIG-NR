<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SEARIG-NR | Portfolio Space</title>
    <meta
      name="description"
      content="A clean playable portfolio space for SEARIG-NR. We will add portfolio locations step by step."
    >
    <meta name="theme-color" content="#080b12">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="space" aria-label="Blank playable portfolio space">
      <canvas id="spaceCanvas" aria-label="Empty portfolio space with playable person"></canvas>

      <section class="intro" aria-label="Portfolio setup">
        <p>SEARIG-NR</p>
        <h1>Empty Plain</h1>
        <span>Blank playable space ready. We will add portfolio parts little by little.</span>
      </section>

      <aside class="controls" aria-label="Controls">
        <strong>Controls</strong>
        <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move</span>
        <span><kbd>Shift</kbd> Run</span>
      </aside>
    </main>

    <script src="app.js"></script>
  </body>
</html>
